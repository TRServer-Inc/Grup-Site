<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Haber Admin Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #18181b; color: #fff; padding: 20px; }
        .box { max-width: 600px; margin: 0 auto; background: #27272a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        h2 { margin-bottom: 15px; color: #ef4444; }
        input, textarea, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #3f3f46; background: #09090b; color: #fff; }
        button { background: #ef4444; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="box">
        <h2>⚙️ GitHub Ayarları</h2>
        <input type="text" id="gh-username" placeholder="GitHub Kullanıcı Adın">
        <input type="text" id="gh-repo" placeholder="Repository Adı (Örn: grup-haber)">
        <input type="password" id="gh-token" placeholder="GitHub Personal Token (ghp_...)">
        <button onclick="saveSettings()">Ayarları Kaydet</button>
    </div>

    <div class="box">
        <h2>📺 OBS Son Dakika Bandı Değiştir</h2>
        <input type="text" id="ticker-text" placeholder="OBS'de kayacak alt yazı metni...">
        <button onclick="updateTicker()">OBS Bandını Güncelle</button>
    </div>

    <div class="box">
        <h2>📰 Web Sitesine Haber Ekle</h2>
        <input type="text" id="news-title" placeholder="Haber Başlığı">
        <textarea id="news-content" rows="4" placeholder="Haber Detayı..."></textarea>
        <button onclick="addNews()">Haberi Yayınla</button>
    </div>

    <script>
        // Ayarları tarayıcı hafızasında saklar
        document.getElementById('gh-username').value = localStorage.getItem('gh_user') || '';
        document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';

        function saveSettings() {
            localStorage.setItem('gh_user', document.getElementById('gh-username').value);
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value);
            localStorage.setItem('gh_token', document.getElementById('gh-token').value);
            alert('ayarlar kaydedildi!');
        }

        async function updateGithubFile(updateFn) {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!user || !repo || !token) {
                alert('önce github ayarlarını doldurup kaydet!');
                return;
            }

            const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
            
            // 1. mevcut data.json'ı ve sha kodunu al
            const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            const fileData = await getRes.json();
            
            // base64 decode
            const contentDecoded = decodeURIComponent(escape(atob(fileData.content)));
            let json = JSON.parse(contentDecoded);

            // 2. veriyi güncelle
            json = updateFn(json);

            // 3. tekrar encode edip github'a pushla
            const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(json, null, 2))));

            const putRes = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'data.json güncellendi',
                    content: updatedContent,
                    sha: fileData.sha
                })
            });

            if (putRes.ok) {
                alert('başarıyla güncellendi!');
            } else {
                alert('hata oluştu, token veya repo bilgilerini kontrol et.');
            }
        }

        function updateTicker() {
            const text = document.getElementById('ticker-text').value;
            if(!text) return;
            updateGithubFile(json => {
                json.obs_ticker = text;
                return json;
            });
        }

        function addNews() {
            const title = document.getElementById('news-title').value;
            const content = document.getElementById('news-content').value;
            if(!title || !content) return;

            updateGithubFile(json => {
                json.news.push({
                    title: title,
                    content: content,
                    date: new Date().toLocaleString('tr-TR')
                });
                return json;
            });
            
            document.getElementById('news-title').value = '';
            document.getElementById('news-content').value = '';
        }
    </script>
</body>
</html>
